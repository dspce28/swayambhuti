# Friday 18:13 IST: learn from Sunil's edits → update the voice guide; report autopilot readiness.
name: Social — learn from edits
on:
  schedule:
    - cron: '43 12 * * 5' # 12:43 UTC Friday = 18:13 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency: social-content

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - run: npm ci
      - run: node learn.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOCIAL_SHEET_URL: ${{ secrets.SOCIAL_SHEET_URL }}
          SOCIAL_SHEET_SECRET: ${{ secrets.SOCIAL_SHEET_SECRET }}
      - name: Commit the updated voice guide
        working-directory: .
        run: |
          git add automation/voice
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "social-bot"
          git config user.email "social-bot@users.noreply.github.com"
          git commit -m "Social: voice guide learned from this week's edits"
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; sleep $((i * 5)); done
          exit 1
